    // --- Initial Seed Database ---
    const INITIAL_USERS = [

    const INITIAL_MESSAGES = [
      {
        id: 'msg-1',
        sender_id: 'user-priya-2',
        receiver_id: 'user-alex-1',
        message_content: "Hey Alex! Loved your past UI project at TreeHacks. Are you still seeking an AI/ML teammate for CalHacks 11.0?",
        timestamp: new Date(Date.now() - 1000 * 60 * 90).toISOString(),
        is_read: true
      },
      {
        id: 'msg-2',
        sender_id: 'user-alex-1',
        receiver_id: 'user-priya-2',
        message_content: "Hey Priya! Yes absolutely, that would be amazing! I saw your research on autonomous LLM agents. Let's build something epic.",
        timestamp: new Date(Date.now() - 1000 * 60 * 75).toISOString(),
        is_read: true
      },
      {
        id: 'msg-3',
        sender_id: 'user-priya-2',
        receiver_id: 'user-alex-1',
        message_content: "Awesome! I sent you a contact request so we can hop on Discord / phone call.",
        timestamp: new Date(Date.now() - 1000 * 60 * 30).toISOString(),
        is_read: true
      }
    ];

    const INITIAL_CONTACT_REQUESTS = [
      {
        id: 'req-1',
        requester_id: 'user-priya-2',
        target_user_id: 'user-alex-1',
        status: 'approved',
        created_at: new Date(Date.now() - 1000 * 60 * 40).toISOString(),
        updated_at: new Date(Date.now() - 1000 * 60 * 35).toISOString()
      }
    ];

    // Local Storage Data Engine
    function loadStorage(key, fallback) {
      try {
        const item = localStorage.getItem('teammatch_' + key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function saveStorage(key, val) {
      try {
        localStorage.setItem('teammatch_' + key, JSON.stringify(val));
      } catch (e) {}
    }

    // --- Main TeamMatch Application ---
    function TeamMatchApp() {
      // Core DB state
      const [users, setUsers] = useState(() => loadStorage('users', INITIAL_USERS));
      const [messages, setMessages] = useState(() => loadStorage('messages', INITIAL_MESSAGES));
      const [contactRequests, setContactRequests] = useState(() => loadStorage('contact_requests', INITIAL_CONTACT_REQUESTS));
      const [currentUser, setCurrentUser] = useState(() => {
        const savedId = loadStorage('current_user_id', 'user-alex-1');
        return INITIAL_USERS.find(u => u.id === savedId) || INITIAL_USERS[0];
      });

      // Navigation & Modal Views
      const [currentView, setCurrentView] = useState('discover'); // 'discover' | 'messages' | 'landing'
      const [selectedUserModal, setSelectedUserModal] = useState(null);
      const [activeChatTarget, setActiveChatTarget] = useState(null);
      const [authModal, setAuthModal] = useState({ isOpen: false, tab: 'login' });
      const [editProfileModalOpen, setEditProfileModalOpen] = useState(false);
      const [notificationsModalOpen, setNotificationsModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSkill, setSelectedSkill] = useState('All');
      const [selectedExperience, setSelectedExperience] = useState('all');
      const [locationFilter, setLocationFilter] = useState('');
      const [hackathonFilter, setHackathonFilter] = useState('All');

      // Demo dropdown
      const [demoMenuOpen, setDemoMenuOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Persist changes
      useEffect(() => { saveStorage('users', users); }, [users]);
      useEffect(() => { saveStorage('messages', messages); }, [messages]);
      useEffect(() => { saveStorage('contact_requests', contactRequests); }, [contactRequests]);
      useEffect(() => {
        if (currentUser) {
          saveStorage('current_user_id', currentUser.id);
        }
      }, [currentUser]);

      // Helper: Check if contact info is approved between userA and userB
      const getContactStatus = (userAId, userBId) => {
        if (!userAId || !userBId) return { status: 'none', canReveal: false, requestId: null, direction: 'none' };
        if (userAId === userBId) return { status: 'self', canReveal: true, requestId: null, direction: 'none' };

        const req = contactRequests.find(r =>
          (r.requester_id === userAId && r.target_user_id === userBId) ||
          (r.requester_id === userBId && r.target_user_id === userAId)
        );

        if (!req) return { status: 'none', canReveal: false, requestId: null, direction: 'none' };

        return {
          status: req.status, // 'pending' | 'approved' | 'denied'
          canReveal: req.status === 'approved',
          requestId: req.id,
          direction: req.requester_id === userAId ? 'sent' : 'received'
        };
      };

      // Helper: Sanitize user profile with Privacy Gate
      const sanitizeUserForViewer = (targetUser, viewerId) => {
        const statusInfo = getContactStatus(viewerId, targetUser.id);
        const canSee = statusInfo.canReveal;

        return {
          ...targetUser,
          email: canSee ? targetUser.email : null,
          phone_number: canSee ? targetUser.phone_number : null,
          contact_revealed: canSee,
          contact_status: statusInfo.status,
          contact_request_id: statusInfo.requestId,
          contact_request_direction: statusInfo.direction
        };
      };

      // Demo User Switching
      const handleSwitchUser = (userId) => {
        const found = users.find(u => u.id === userId);
        if (found) {
          setCurrentUser(found);
          setDemoMenuOpen(false);
          setMobileMenuOpen(false);
          setToast({
            title: `Logged in as ${found.full_name}`,
            message: `${found.experience_level} • ${found.skills?.[0] || 'Hacker'}`
          });
        }
      };

      // Contact Request Actions
      const handleRequestContact = (targetUserId) => {
        if (!currentUser) {
          setAuthModal({ isOpen: true, tab: 'login' });
          return;
        }
        if (currentUser.id === targetUserId) return;

        const target = users.find(u => u.id === targetUserId);
        const existingIdx = contactRequests.findIndex(r =>
          (r.requester_id === currentUser.id && r.target_user_id === targetUserId) ||
          (r.requester_id === targetUserId && r.target_user_id === currentUser.id)
        );

        let newReq;
        if (existingIdx !== -1) {
          const updated = [...contactRequests];
          updated[existingIdx].status = 'pending';
          updated[existingIdx].requester_id = currentUser.id;
          updated[existingIdx].target_user_id = targetUserId;
          updated[existingIdx].updated_at = new Date().toISOString();
          setContactRequests(updated);
          newReq = updated[existingIdx];
        } else {
          newReq = {
            id: 'req-' + Date.now(),
            requester_id: currentUser.id,
            target_user_id: targetUserId,
            status: 'pending',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          };
          setContactRequests([...contactRequests, newReq]);
        }

        setToast({
          title: "Contact Request Sent! ✉️",
          message: `Waiting for ${target?.full_name || 'teammate'} to approve sharing email & phone.`
        });
      };

      const handleRespondContact = (requestId, newStatus) => {
        const req = contactRequests.find(r => r.id === requestId);
        if (!req) return;

        const updated = contactRequests.map(r =>
          r.id === requestId ? { ...r, status: newStatus, updated_at: new Date().toISOString() } : r
        );
        setContactRequests(updated);

        const otherUserId = req.requester_id === currentUser.id ? req.target_user_id : req.requester_id;
        const otherUser = users.find(u => u.id === otherUserId);

        setToast({
          title: newStatus === 'approved' ? "Contact Request Approved! 🎉" : "Contact Request Declined",
          message: newStatus === 'approved'
            ? `You and ${otherUser?.full_name || 'Teammate'} can now see each other's phone & email!`
            : "Request was declined."
        });
      };

      // Send Message
      const handleSendMessage = (receiverId, content) => {
        if (!content || !content.trim() || !currentUser) return;
        const newMsg = {
          id: 'msg-' + Date.now(),
          sender_id: currentUser.id,
          receiver_id: receiverId,
          message_content: content.trim(),
          timestamp: new Date().toISOString(),
          is_read: false
        };
        setMessages([...messages, newMsg]);
      };

      // Filtered Feed
      const filteredUsers = users
        .filter(u => !currentUser || u.id !== currentUser.id)
        .filter(u => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchesName = u.full_name.toLowerCase().includes(q);
            const matchesBio = u.bio?.toLowerCase().includes(q);
            const matchesLoc = u.location.toLowerCase().includes(q);
            const matchesSkill = u.skills?.some(s => s.toLowerCase().includes(q));
            if (!matchesName && !matchesBio && !matchesLoc && !matchesSkill) return false;
          }
          if (selectedSkill !== 'All') {
            const s = selectedSkill.toLowerCase();
            if (!u.skills?.some(tag => tag.toLowerCase() === s || tag.toLowerCase().includes(s))) return false;
          }
          if (selectedExperience !== 'all') {
            if (u.experience_level.toLowerCase() !== selectedExperience.toLowerCase()) return false;
          }
          if (locationFilter.trim()) {
            if (!u.location.toLowerCase().includes(locationFilter.toLowerCase())) return false;
          }
          if (hackathonFilter !== 'All') {
            const hName = hackathonFilter.toLowerCase();
            const upcoming = u.hackathons?.filter(h => h.type === 'upcoming') || [];
            if (!upcoming.some(h => h.hackathon_name.toLowerCase().includes(hName))) return false;
          }
          return true;
        })
        .map(u => sanitizeUserForViewer(u, currentUser?.id));

      // Pending requests for current user
      const pendingIncomingRequests = contactRequests
        .filter(r => currentUser && r.target_user_id === currentUser.id && r.status === 'pending')
        .map(r => {
          const reqUser = users.find(u => u.id === r.requester_id);
          return { ...r, requester: reqUser };
        });

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-20 right-4 z-50 max-w-sm w-full bg-slate-900 border border-indigo-500/40 rounded-2xl shadow-2xl p-4 animate-in slide-in-from-top-4 duration-200">
              <div className="flex items-start justify-between">
                <div className="flex items-start space-x-3">
                  <div className="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
                    <Icon name="sparkles" className="w-4 h-4" />
                  </div>
                  <div>
                    <h4 className="font-bold text-xs text-white">{toast.title}</h4>
                    <p className="text-xs text-slate-300 mt-0.5">{toast.message}</p>
                  </div>
                </div>
                <button onClick={() => setToast(null)} className="text-slate-500 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            </div>
          )}

          {/* Top Navbar */}
          <header className="sticky top-0 z-40 w-full border-b border-slate-800 bg-[#060913]/90 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo */}
              <div
                className="flex items-center space-x-3 cursor-pointer"

                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-base text-white">
                    {authModal.tab === 'login' ? 'Sign In to TeamMatch' : 'Create Student Account'}
                  </h3>
                  <button onClick={() => setAuthModal({ isOpen: false, tab: 'login' })} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="grid grid-cols-2 p-1 mb-4 bg-slate-950 rounded-xl border border-slate-800">
                  <button
                    onClick={() => setAuthModal({ ...authModal, tab: 'login' })}
                    className={`py-1.5 text-xs font-semibold rounded-lg ${authModal.tab === 'login' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => setAuthModal({ ...authModal, tab: 'register' })}
                    className={`py-1.5 text-xs font-semibold rounded-lg ${authModal.tab === 'register' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                  >
                    Create Account
                  </button>
                </div>

                {/* Quick Persona Buttons */}
                <div className="mb-4">
                  <p className="text-[10px] uppercase font-bold text-slate-500 mb-1.5">Fast Test Login:</p>
                  <div className="grid grid-cols-2 gap-1.5">
                    {users.slice(0, 4).map(u => (
                      <button
                        key={u.id}
                        type="button"
                        onClick={() => {
                          handleSwitchUser(u.id);
                          setAuthModal({ isOpen: false, tab: 'login' });
                        }}
                        className="p-2 rounded-xl bg-slate-950 border border-slate-800 hover:border-indigo-500 text-left text-xs"
                      >
                        <div className="font-semibold text-slate-200 truncate">{u.full_name}</div>
                        <div className="text-[10px] text-slate-400 truncate">{u.skills?.[0]}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Registration form */}
                {authModal.tab === 'register' && (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const form = e.target;
                      const newUser = {
                        id: 'user-' + Date.now(),
                        full_name: form.fullName.value,
                        email: form.email.value,
                        phone_number: form.phone.value,
                        location: form.location.value,
                        skills: form.skills.value.split(',').map(s => s.trim()).filter(Boolean),
                        experience_level: form.experience.value,
                        bio: form.bio.value,
                        avatar_url: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(form.fullName.value)}`,
                        hackathons: []
                      };
                      setUsers([...users, newUser]);
                      setCurrentUser(newUser);
                      setAuthModal({ isOpen: false, tab: 'login' });
                      setEditProfileModalOpen(true);
                    }}
                    className="space-y-2.5 text-xs"
                  >
                    <div>
                      <label className="block text-slate-300 mb-1">Full Name</label>
                      <input name="fullName" required placeholder="Maya Lin" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-300 mb-1">Email</label>
                        <input name="email" type="email" required placeholder="maya@edu.com" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1">Phone</label>
                        <input name="phone" placeholder="+1 (555) 000-0000" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-300 mb-1">Location</label>
                        <input name="location" required placeholder="San Francisco, CA" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1">Experience</label>
                        <select name="experience" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white">
                          <option value="Beginner">Beginner</option>
                          <option value="Intermediate">Intermediate</option>
                          <option value="Advanced">Advanced</option>
                          <option value="Expert">Expert</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">Skills (comma-separated)</label>
                      <input name="skills" placeholder="React, Python, UI/UX" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">Bio</label>
                      <textarea name="bio" rows="2" placeholder="What tracks or projects do you want to build?" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white resize-none" />
                    </div>
                    <button type="submit" className="w-full mt-2 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">
                      Create Account & Setup Hackathons
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- Sub-component: Edit Profile Modal with Dynamic Hackathons ---
    function EditProfileModalContent({ user, onClose, onSave }) {
      const [fullName, setFullName] = useState(user?.full_name || '');
      const [location, setLocation] = useState(user?.location || '');
      const [phone, setPhone] = useState(user?.phone_number || '');
      const [experience, setExperience] = useState(user?.experience_level || 'Intermediate');
      const [bio, setBio] = useState(user?.bio || '');
      const [skills, setSkills] = useState(user?.skills || []);
      const [skillInput, setSkillInput] = useState('');

      const initialUpcoming = user?.hackathons?.filter(h => h.type === 'upcoming') || [];
      const initialPast = user?.hackathons?.filter(h => h.type === 'past') || [];

      const [upcoming, setUpcoming] = useState(initialUpcoming.length > 0 ? initialUpcoming : [{ hackathon_name: '', location: '' }]);
      const [past, setPast] = useState(initialPast.length > 0 ? initialPast : [{ hackathon_name: '', location: '' }]);

      const handleAddSkill = () => {
        if (skillInput.trim() && !skills.includes(skillInput.trim())) {
          setSkills([...skills, skillInput.trim()]);
          setSkillInput('');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const combined = [
          ...upcoming.filter(h => h.hackathon_name.trim()).map(h => ({ ...h, type: 'upcoming' })),
          ...past.filter(h => h.hackathon_name.trim()).map(h => ({ ...h, type: 'past' }))
        ];
        onSave({
          ...user,
          full_name: fullName,
          location,
          phone_number: phone,
          experience_level: experience,
          bio,
          skills,
          hackathons: combined
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in">
          <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-base text-white">Edit Profile & Hackathons</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 overflow-y-auto space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 mb-1">Full Name</label>
                  <input value={fullName} onChange={e => setFullName(e.target.value)} required className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                </div>
                <div>
                  <label className="block text-slate-300 mb-1">Location / University</label>
                  <input value={location} onChange={e => setLocation(e.target.value)} required className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-300 mb-1">Phone Number (Hidden by default)</label>
                  <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="+1 (555) 000-0000" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white" />
                </div>
                <div>
                  <label className="block text-slate-300 mb-1">Experience Level</label>
                  <select value={experience} onChange={e => setExperience(e.target.value)} className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                    <option value="Expert">Expert</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-slate-300 mb-1">Bio</label>
                <textarea value={bio} onChange={e => setBio(e.target.value)} rows="2" className="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-white resize-none" />
              </div>

              {/* Skills Tags */}
              <div>
                <label className="block text-slate-300 mb-1 font-semibold">Technical Skills</label>
                <div className="flex flex-wrap gap-1.5 p-2 rounded-lg bg-slate-950 border border-slate-800 mb-2">
                  {skills.map(s => (
                    <span key={s} className="px-2 py-0.5 rounded bg-indigo-600/30 text-indigo-300 font-mono text-[11px] flex items-center space-x-1">
                      <span>{s}</span>
                      <button type="button" onClick={() => setSkills(skills.filter(x => x !== s))} className="hover:text-rose-400">×</button>
                    </span>
                  ))}
                </div>
                <div className="flex space-x-2">
                  <input
                    value={skillInput}
                    onChange={e => setSkillInput(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddSkill(); } }}
                    placeholder="Add custom skill (e.g. Next.js, PyTorch, Rust)..."
                    className="flex-1 p-2 rounded-lg bg-slate-950 border border-slate-800 text-white"
                  />
                  <button type="button" onClick={handleAddSkill} className="px-3 py-1.5 rounded-lg bg-slate-800 text-white">Add</button>
                </div>
              </div>

              {/* Dynamic Upcoming Hackathons */}
              <div className="pt-2 border-t border-slate-800">
                <div className="flex items-center justify-between mb-2">
                  <label className="font-bold text-indigo-400 uppercase tracking-wider">Upcoming Hackathons</label>
                  <button type="button" onClick={() => setUpcoming([...upcoming, { hackathon_name: '', location: '' }])} className="text-indigo-400 hover:text-indigo-300 font-semibold">
                    + Add Hackathon
                  </button>
                </div>
                <div className="space-y-2">
                  {upcoming.map((h, i) => (
                    <div key={i} className="flex space-x-2">
                      <input
                        placeholder="Hackathon Name (e.g. CalHacks 11.0)"
                        value={h.hackathon_name}
                        onChange={e => {
                          const copy = [...upcoming];
                          copy[i].hackathon_name = e.target.value;
                          setUpcoming(copy);
                        }}
                        className="flex-1 p-2 rounded-lg bg-slate-950 border border-slate-800 text-white"
                      />
                      <input
                        placeholder="Location (e.g. SF, CA)"
                        value={h.location}
                        onChange={e => {
                          const copy = [...upcoming];
                          copy[i].location = e.target.value;
                          setUpcoming(copy);
                        }}
                        className="w-36 p-2 rounded-lg bg-slate-950 border border-slate-800 text-white"
                      />
                      <button type="button" onClick={() => setUpcoming(upcoming.filter((_, idx) => idx !== i))} className="p-2 text-slate-500 hover:text-rose-400">
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Dynamic Past Hackathons */}
              <div className="pt-2 border-t border-slate-800">
                <div className="flex items-center justify-between mb-2">
                  <label className="font-bold text-amber-400 uppercase tracking-wider">Recently Participated Hackathons</label>
                  <button type="button" onClick={() => setPast([...past, { hackathon_name: '', location: '' }])} className="text-amber-400 hover:text-amber-300 font-semibold">
                    + Add Past Hackathon
                  </button>
                </div>
                <div className="space-y-2">
                  {past.map((h, i) => (
                    <div key={i} className="flex space-x-2">
                      <input
                        placeholder="Past Hackathon (e.g. TreeHacks 2025)"
                        value={h.hackathon_name}
                        onChange={e => {
                          const copy = [...past];
                          copy[i].hackathon_name = e.target.value;
                          setPast(copy);
                        }}
                        className="flex-1 p-2 rounded-lg bg-slate-950 border border-slate-800 text-white"
                      />
                      <input
                        placeholder="Location"
                        value={h.location}
                        onChange={e => {
                          const copy = [...past];
                          copy[i].location = e.target.value;
                          setPast(copy);
                        }}
                        className="w-36 p-2 rounded-lg bg-slate-950 border border-slate-800 text-white"
                      />
                      <button type="button" onClick={() => setPast(past.filter((_, idx) => idx !== i))} className="p-2 text-slate-500 hover:text-rose-400">
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-4 border-t border-slate-800 flex justify-end space-x-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Cancel</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Save Profile</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Sub-component: Chat Input Bar ---
    function ChatInputBar({ onSend, partnerName }) {
      const [text, setText] = useState('');

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (text.trim()) {
          onSend(text.trim());
          setText('');
        }
      };

      return (
        <form onSubmit={handleFormSubmit} className="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/80 flex items-center space-x-2">
          <input
            type="text"
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder={`Message ${partnerName}...`}
            className="flex-1 py-2.5 px-4 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-500 focus:border-indigo-500 outline-none"
          />
          <button
            type="submit"
            disabled={!text.trim()}
            className={`p-2.5 rounded-xl text-white transition-all ${text.trim() ? 'bg-indigo-600 hover:bg-indigo-500 shadow-md' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
          >
            <Icon name="send" className="w-4 h-4" />
          </button>
        </form>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TeamMatchApp />);
  </script>
</body>
</html>
